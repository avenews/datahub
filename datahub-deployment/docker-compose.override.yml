services:

  frontend-quickstart:
    image: ${DATAHUB_FRONTEND_IMAGE}:${DATAHUB_FRONTEND_VERSION}
    ports:
      - "9002:9002"
    volumes:
      - ./datahub-config/user.props:/datahub-frontend/conf/user.props
    environment:
      DATAHUB_SECRET: ${DATAHUB_SECRET:?must be 32+ chars}
      DATAHUB_TOKEN_SERVICE_SIGNING_KEY: ${DATAHUB_TOKEN_SERVICE_SIGNING_KEY:?must be set}
      DATAHUB_TOKEN_SERVICE_SALT: ${DATAHUB_TOKEN_SERVICE_SALT:?must be set}
      AUTH_OIDC_ENABLED: "true"
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:?must be set}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:?must be set}
      AUTH_OIDC_DISCOVERY_URI: "https://accounts.google.com/.well-known/openid-configuration"
      AUTH_OIDC_BASE_URL: ${AUTH_OIDC_BASE_URL:?must be set}
      AUTH_OIDC_USER_NAME_CLAIM: "email"
      AUTH_OIDC_JIT_PROVISIONING_ENABLED: "false"
      AUTH_OIDC_PRE_PROVISIONING_REQUIRED: "true"

  datahub-actions-quickstart:
    image: datahub-actions-custom:latest
    environment:
      UV_INDEX_URL: https://pypi.org/simple
      PIP_INDEX_URL: https://pypi.org/simple

  opensearch:
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms4g -Xmx4g
    mem_limit: 8g

  datahub-gms-quickstart:
    image: acryldata/datahub-gms:${DATAHUB_VERSION}
    environment:
      DATAHUB_SECRET: ${DATAHUB_SECRET:?must be 32+ chars}
      DATAHUB_TOKEN_SERVICE_SIGNING_KEY: ${DATAHUB_TOKEN_SERVICE_SIGNING_KEY:?must be set}
      DATAHUB_TOKEN_SERVICE_SALT: ${DATAHUB_TOKEN_SERVICE_SALT:?must be set}
      METADATA_SERVICE_AUTH_ENABLED: "false"

  mysql:
    image: mysql:8.2
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?must be set}

