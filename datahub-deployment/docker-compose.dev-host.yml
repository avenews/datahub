# Settings that apply only to the new DataHub dev host. The deploy script adds this as the last -f file, so the
# existing docker-compose.quickstart-base.yml and docker-compose.override.yml stay exactly as they are.
services:
  # Images come from ECR, tagged by the pipeline.
  datahub-actions-quickstart:
    image: ${DATAHUB_ACTIONS_IMAGE}:${DATAHUB_ACTIONS_VERSION}

  # The dev host has 8 GB of RAM; the live host runs OpenSearch with a 4 GB heap.
  opensearch:
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g}
    mem_limit: ${OPENSEARCH_MEM_LIMIT:-3g}
    ports: !reset []

  # MySQL and Kafka stay reachable by the other containers only, not on the host's network.
  mysql:
    ports: !reset []
  kafka-broker:
    ports: !reset []
