# Plain (non-secret) settings of the DataHub prod host. Secrets come from AWS Secrets Manager (datahub/prod/*)
# and the image references from the deploy script; nothing sensitive belongs in this file.
# (Named .conf, not .env: the repository's .gitignore ignores *.env.)
DATAHUB_VERSION=v1.7.0.1
UI_INGESTION_DEFAULT_CLI_VERSION=1.7.0.9

# The internal prod ALB serves this name (VPN only). The Google OAuth client must allow
# https://datahub.avenews.io/callback/oidc.
AUTH_OIDC_BASE_URL=https://datahub.avenews.io

# Same size as the dev host: 8 GB of RAM, so OpenSearch gets a 1 GB heap. Raise both with the instance size.
OPENSEARCH_HEAP=1g
OPENSEARCH_MEM_LIMIT=3g
