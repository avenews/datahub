# Plain (non-secret) settings of the DataHub dev host. Secrets come from AWS Secrets Manager (datahub/dev/*)
# and the image references from the deploy script; nothing sensitive belongs in this file.
# (Named .conf, not .env: the repository's .gitignore ignores *.env.)
DATAHUB_VERSION=v1.7.0.1
UI_INGESTION_DEFAULT_CLI_VERSION=1.7.0.9

# Temporary test URL while the new host is checked. At the cut-over this becomes https://dev-datahub.avenews.io
# (the Google OAuth client already allows that callback).
AUTH_OIDC_BASE_URL=https://dev-datahub-new.avenews.io

# The dev host has 8 GB of RAM (the old host ran OpenSearch with a 4 GB heap).
OPENSEARCH_HEAP=1g
OPENSEARCH_MEM_LIMIT=3g
