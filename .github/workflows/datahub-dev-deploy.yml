name: DataHub dev deploy

# Builds the custom DataHub images, pushes them to ECR, and deploys the chosen services to the DataHub dev host
# (avenews-dev-datahub) through SSM Run Command. Manual only: nothing runs until someone starts it from the
# Actions tab, and only from the feat/avenews branch (the AWS role refuses any other).
#
# Infrastructure and the AWS role: avenews/infrastructure, environments/dev/datahub.tf.
# What the host does: datahub-deployment/deploy/deploy.sh (secrets come from Secrets Manager datahub/dev/*).

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Services to build and deploy. gms and all also run the system-update job."
        type: choice
        required: true
        default: frontend
        options:
          - frontend
          - actions
          - frontend,actions
          - gms
          - all

permissions:
  id-token: write
  contents: read

concurrency:
  group: datahub-dev-deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::647948507563:role/avenews-dev-datahub-github-deploy
  DEPLOY_INSTANCE_ID: i-0ae9a5573d88062da
  BUNDLE_BUCKET: avenews-dev-datahub-deploy
  ECR_REGISTRY: 647948507563.dkr.ecr.us-east-1.amazonaws.com

jobs:
  build:
    name: Build and push images
    # Frontend and actions are the only custom images; gms alone has nothing to build.
    if: github.ref == 'refs/heads/feat/avenews' && contains(fromJSON('["frontend","actions","frontend,actions","all"]'), inputs.services)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      frontend_tag: ${{ steps.tags.outputs.frontend_tag }}
      actions_tag: ${{ steps.tags.outputs.actions_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Work out the image tags
        id: tags
        run: |
          version="$(sed -n 's/^DATAHUB_VERSION=//p' datahub-deployment/deploy/config/dev.conf)"
          tag="${version}-${GITHUB_SHA::7}"
          [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo "bad tag: $tag"; exit 1; }
          case "${{ inputs.services }}" in
            frontend|all|frontend,actions) echo "frontend_tag=$tag" >> "$GITHUB_OUTPUT" ;;
          esac
          case "${{ inputs.services }}" in
            actions|all|frontend,actions) echo "actions_tag=$tag" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- frontend: the React app is built first; Dockerfile.custom copies datahub-web-react/dist
      - name: Set up Node
        if: steps.tags.outputs.frontend_tag != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: yarn
          cache-dependency-path: datahub-web-react/yarn.lock

      - name: Build the React app
        if: steps.tags.outputs.frontend_tag != ''
        working-directory: datahub-web-react
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Build and push the frontend image
        if: steps.tags.outputs.frontend_tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/datahub-frontend/Dockerfile.custom
          push: true
          tags: ${{ env.ECR_REGISTRY }}/datahub-frontend-custom:${{ steps.tags.outputs.frontend_tag }}
          cache-from: type=gha,scope=datahub-frontend
          cache-to: type=gha,scope=datahub-frontend,mode=max

      # --- actions: Zoho and PostHog sources on top of acryldata/datahub-actions:quickstart-locked
      - name: Build and push the actions image
        if: steps.tags.outputs.actions_tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/datahub-actions/Dockerfile.custom
          push: true
          tags: ${{ env.ECR_REGISTRY }}/datahub-actions-custom:${{ steps.tags.outputs.actions_tag }}
          cache-from: type=gha,scope=datahub-actions
          cache-to: type=gha,scope=datahub-actions,mode=max

  deploy:
    name: Deploy to the DataHub dev host
    needs: build
    # build is skipped when only gms is deployed; it must not have failed or been cancelled.
    if: ${{ !cancelled() && github.ref == 'refs/heads/feat/avenews' && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload the deploy bundle
        run: |
          mkdir -p bundle/config
          cp datahub-deployment/deploy/deploy.sh bundle/
          cp datahub-deployment/deploy/config/dev.conf bundle/config/
          cp datahub-deployment/docker-compose.quickstart-base.yml \
             datahub-deployment/docker-compose.override.yml \
             datahub-deployment/docker-compose.dev-host.yml bundle/
          aws s3 cp bundle "s3://${BUNDLE_BUCKET}/deploy/${GITHUB_SHA}/" --recursive --only-show-errors

      - name: Run the deploy on the host
        env:
          SERVICES: ${{ inputs.services }}
          FRONTEND_TAG: ${{ needs.build.outputs.frontend_tag }}
          ACTIONS_TAG: ${{ needs.build.outputs.actions_tag }}
        run: |
          args="--env dev --bundle-dir /tmp/datahub-bundle --services ${SERVICES}"
          [ -n "$FRONTEND_TAG" ] && args="$args --frontend-tag ${FRONTEND_TAG}"
          [ -n "$ACTIONS_TAG" ]  && args="$args --actions-tag ${ACTIONS_TAG}"

          jq -n --arg bucket "$BUNDLE_BUCKET" --arg sha "$GITHUB_SHA" --arg args "$args" '{
            executionTimeout: ["1800"],
            commands: [
              "set -e",
              "command -v aws >/dev/null 2>&1 || snap install aws-cli --classic",
              "rm -rf /tmp/datahub-bundle && mkdir -p /tmp/datahub-bundle",
              ("aws s3 cp s3://" + $bucket + "/deploy/" + $sha + "/ /tmp/datahub-bundle/ --recursive --only-show-errors --region us-east-1"),
              ("bash /tmp/datahub-bundle/deploy.sh " + $args)
            ]
          }' > params.json

          command_id="$(aws ssm send-command \
            --instance-ids "$DEPLOY_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "DataHub dev deploy ${GITHUB_SHA::7} (${SERVICES})" \
            --parameters file://params.json \
            --query Command.CommandId --output text)"
          echo "SSM command: $command_id"

          status=InProgress
          for _ in $(seq 1 360); do
            sleep 5
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$DEPLOY_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          echo "Status: $status"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$DEPLOY_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          [ "$status" = "Success" ]
