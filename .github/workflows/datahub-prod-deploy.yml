name: DataHub prod deploy

# Builds the custom DataHub images, pushes them to ECR, and deploys the chosen services to the DataHub PROD host
# through SSM Run Command. Manual only: nothing runs until someone starts it from the Actions tab. It is separate
# from the dev workflow (datahub-dev-deploy.yml) on purpose: the two have their own variables, GitHub environment
# and AWS role, and run independently.
#
# Every prod run uses the GitHub environment "prod". Give that environment required reviewers and a
# deployment-branch rule (feat/avenews) so each prod deploy waits for an approval; the AWS role trusts only
# environment:prod of this repository, so no run can reach prod without going through it.
#
# No environment-specific value is written in this file. Set these repository variables
# (Settings > Secrets and variables > Actions > Variables); none of them is a secret:
#   DATAHUB_PROD_DEPLOY_BRANCH  optional: the only branch the workflow may deploy from (unset = any branch)
#   DATAHUB_PROD_AWS_REGION     AWS region
#   DATAHUB_PROD_ROLE_ARN       role the workflow assumes with OIDC (infrastructure output datahub_deploy_role_arn)
#   DATAHUB_PROD_INSTANCE_ID    EC2 instance of the DataHub prod host (infrastructure output datahub_instance_id)
#   DATAHUB_PROD_BUNDLE_BUCKET  bucket for the deploy bundle (infrastructure output datahub_deploy_bucket)
# The ECR registry comes from the ECR login step. Application secrets are not in GitHub at all: the host reads
# them from AWS Secrets Manager (datahub/prod/*). What the host does: datahub-deployment/deploy/deploy.sh.

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Services to build and deploy. gms and all also run the system-update job."
        type: choice
        required: true
        default: frontend
        options:
          - frontend
          - actions
          - frontend,actions
          - gms
          - all

permissions:
  id-token: write
  contents: read

concurrency:
  group: datahub-prod-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.DATAHUB_PROD_AWS_REGION }}
  AWS_ROLE_ARN: ${{ vars.DATAHUB_PROD_ROLE_ARN }}
  DEPLOY_INSTANCE_ID: ${{ vars.DATAHUB_PROD_INSTANCE_ID }}
  BUNDLE_BUCKET: ${{ vars.DATAHUB_PROD_BUNDLE_BUCKET }}

jobs:
  build:
    name: Build and push images
    # Frontend and actions are the only custom images; gms alone has nothing to build.
    if: (vars.DATAHUB_PROD_DEPLOY_BRANCH == '' || github.ref == format('refs/heads/{0}', vars.DATAHUB_PROD_DEPLOY_BRANCH)) && contains(fromJSON('["frontend","actions","frontend,actions","all"]'), inputs.services)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The prod environment makes the OIDC token say environment:prod, which is all the prod AWS role trusts.
    environment: prod
    outputs:
      frontend_tag: ${{ steps.tags.outputs.frontend_tag }}
      actions_tag: ${{ steps.tags.outputs.actions_tag }}
    steps:
      - name: Check the repository variables
        run: |
          missing=0
          for v in AWS_REGION AWS_ROLE_ARN; do
            [ -n "${!v:-}" ] || { echo "::error::$v is empty: set the matching repository variable (see the top of this workflow)"; missing=1; }
          done
          exit "$missing"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Work out the image tags
        id: tags
        run: |
          version="$(sed -n 's/^DATAHUB_VERSION=//p' datahub-deployment/deploy/config/prod.conf)"
          tag="${version}-${GITHUB_SHA::7}"
          [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || { echo "bad tag: $tag"; exit 1; }
          case "${{ inputs.services }}" in
            frontend|all|frontend,actions) echo "frontend_tag=$tag" >> "$GITHUB_OUTPUT" ;;
          esac
          case "${{ inputs.services }}" in
            actions|all|frontend,actions) echo "actions_tag=$tag" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- frontend: the React app is built first; Dockerfile.custom copies datahub-web-react/dist
      - name: Set up Node
        if: steps.tags.outputs.frontend_tag != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: yarn
          cache-dependency-path: datahub-web-react/yarn.lock

      - name: Build the React app
        if: steps.tags.outputs.frontend_tag != ''
        working-directory: datahub-web-react
        run: |
          yarn install --frozen-lockfile
          # The same prebuild steps as the Gradle yarnBuild task (datahub-web-react/build.gradle):
          # the per-icon stubs that vite.config.ts asserts exist, and the ingestion connector registry JSON.
          node scripts/generate-lazy-icon-stubs.js
          mkdir -p public/assets/ingestion/connector_registry
          cp ../metadata-ingestion/src/datahub/ingestion/autogenerated/connector_registry/*.json public/assets/ingestion/connector_registry/
          yarn build

      - name: Build and push the frontend image
        if: steps.tags.outputs.frontend_tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/datahub-frontend/Dockerfile.custom
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/datahub-frontend-custom:${{ steps.tags.outputs.frontend_tag }}
          cache-from: type=gha,scope=datahub-frontend
          cache-to: type=gha,scope=datahub-frontend,mode=max

      # --- actions: Zoho and PostHog sources on top of acryldata/datahub-actions:quickstart-locked
      - name: Build and push the actions image
        if: steps.tags.outputs.actions_tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/datahub-actions/Dockerfile.custom
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/datahub-actions-custom:${{ steps.tags.outputs.actions_tag }}
          cache-from: type=gha,scope=datahub-actions
          cache-to: type=gha,scope=datahub-actions,mode=max

  deploy:
    name: Deploy to the DataHub prod host
    needs: build
    # build is skipped when only gms is deployed; it must not have failed or been cancelled.
    if: ${{ !cancelled() && (vars.DATAHUB_PROD_DEPLOY_BRANCH == '' || github.ref == format('refs/heads/{0}', vars.DATAHUB_PROD_DEPLOY_BRANCH)) && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod
    steps:
      - name: Check the repository variables
        run: |
          missing=0
          for v in AWS_REGION AWS_ROLE_ARN DEPLOY_INSTANCE_ID BUNDLE_BUCKET; do
            [ -n "${!v:-}" ] || { echo "::error::$v is empty: set the matching repository variable (see the top of this workflow)"; missing=1; }
          done
          exit "$missing"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload the deploy bundle
        run: |
          mkdir -p bundle/config
          cp datahub-deployment/deploy/deploy.sh bundle/
          cp datahub-deployment/deploy/config/prod.conf bundle/config/
          cp datahub-deployment/docker-compose.quickstart-base.yml \
             datahub-deployment/docker-compose.override.yml \
             datahub-deployment/docker-compose.dev-host.yml bundle/
          # One archive, so the host needs only s3:GetObject on the key (no ListBucket).
          tar -czf bundle.tgz -C bundle .
          aws s3 cp bundle.tgz "s3://${BUNDLE_BUCKET}/deploy/${GITHUB_SHA}/bundle.tgz" --only-show-errors

      - name: Run the deploy on the host
        env:
          SERVICES: ${{ inputs.services }}
          FRONTEND_TAG: ${{ needs.build.outputs.frontend_tag }}
          ACTIONS_TAG: ${{ needs.build.outputs.actions_tag }}
        run: |
          args="--env prod --region ${AWS_REGION} --bundle-dir /tmp/datahub-bundle --services ${SERVICES}"
          [ -n "$FRONTEND_TAG" ] && args="$args --frontend-tag ${FRONTEND_TAG}"
          [ -n "$ACTIONS_TAG" ]  && args="$args --actions-tag ${ACTIONS_TAG}"

          jq -n --arg bucket "$BUNDLE_BUCKET" --arg sha "$GITHUB_SHA" --arg region "$AWS_REGION" --arg args "$args" '{
            executionTimeout: ["1800"],
            commands: [
              "set -e",
              "command -v aws >/dev/null 2>&1 || snap install aws-cli --classic",
              "rm -rf /tmp/datahub-bundle /tmp/datahub-bundle.tgz && mkdir -p /tmp/datahub-bundle",
              ("aws s3 cp s3://" + $bucket + "/deploy/" + $sha + "/bundle.tgz /tmp/datahub-bundle.tgz --only-show-errors --region " + $region),
              "tar -xzf /tmp/datahub-bundle.tgz -C /tmp/datahub-bundle",
              ("bash /tmp/datahub-bundle/deploy.sh " + $args)
            ]
          }' > params.json

          command_id="$(aws ssm send-command \
            --instance-ids "$DEPLOY_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "DataHub prod deploy ${GITHUB_SHA::7} (${SERVICES})" \
            --parameters file://params.json \
            --query Command.CommandId --output text)"
          echo "SSM command: $command_id"

          status=InProgress
          for _ in $(seq 1 360); do
            sleep 5
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$DEPLOY_INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)"
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          echo "Status: $status"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$DEPLOY_INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          [ "$status" = "Success" ]
