# Admin channel: every ingestion run result (success and failure) plus changes to ingestion sources, secrets, access tokens, policies, roles and groups.
name: "slack_data_platform"
source:
  type: "kafka"
  config:
    connection:
      bootstrap: ${KAFKA_BOOTSTRAP_SERVER:-localhost:9092}
      schema_registry_url: ${SCHEMA_REGISTRY_URL:-http://localhost:8081}
    topic_routes:
      mcl: ${METADATA_CHANGE_LOG_VERSIONED_TOPIC_NAME:-MetadataChangeLog_Versioned_v1}
filter:
  event_type: "MetadataChangeLogEvent_v1"
  event:
    entityType:
      - "dataHubExecutionRequest"
      - "dataHubIngestionSource"
      - "dataHubSecret"
      - "dataHubAccessToken"
      - "dataHubPolicy"
      - "dataHubRole"
      - "corpGroup"
    aspectName:
      - "dataHubExecutionRequestResult"
      - "dataHubIngestionSourceInfo"
      - "dataHubSecretValue"
      - "dataHubAccessTokenInfo"
      - "dataHubPolicyInfo"
      - "dataHubRoleInfo"
      - "corpGroupInfo"
action:
  type: "slack_ingestion_failure"
  config:
    bot_token: ${SLACK_BOT_TOKEN}
    signing_secret: ${SLACK_SIGNING_SECRET}
    default_channel: "${SLACK_CHANNEL_DATA_PLATFORM}"
    base_url: ${DATAHUB_BASE_URL:-http://localhost:9002}
datahub:
  server: "${DATAHUB_GMS_PROTOCOL:-http}://${DATAHUB_GMS_HOST:-localhost}:${DATAHUB_GMS_PORT:-8080}"
