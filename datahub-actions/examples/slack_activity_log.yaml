# Logs every EntityChangeEvent (all categories, including system actors) to a single Slack channel.
name: "slack_activity_log"
source:
  type: "kafka"
  config:
    connection:
      bootstrap: ${KAFKA_BOOTSTRAP_SERVER:-localhost:9092}
      schema_registry_url: ${SCHEMA_REGISTRY_URL:-http://localhost:8081}
filter:
  event_type: "EntityChangeEvent_v1"
action:
  type: "slack"
  config:
    bot_token: ${SLACK_BOT_TOKEN}
    signing_secret: ${SLACK_SIGNING_SECRET}
    default_channel: "${SLACK_CHANNEL_ACTIVITY_LOG}"
    base_url: ${DATAHUB_BASE_URL:-http://localhost:9002}
    suppress_system_activity: false
datahub:
  server: "${DATAHUB_GMS_PROTOCOL:-http}://${DATAHUB_GMS_HOST:-localhost}:${DATAHUB_GMS_PORT:-8080}"
